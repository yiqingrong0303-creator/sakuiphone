<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7dce8"><title>사쿠의폰</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f9e8ee,#e8dff1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#392d36;display:grid;place-items:center;padding:24px}.phone{width:min(390px,94vw);height:min(820px,88vh);min-height:620px;border:9px solid #27242a;border-radius:48px;background:#fff;box-shadow:0 24px 70px #71536555;overflow:hidden;position:relative}.screen{height:100%;background:linear-gradient(160deg,#f8e5ed,#f7d6e4 55%,#e9dff0);position:relative;padding:18px 20px}.status{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.lock{text-align:center;padding-top:95px}.date{font-size:16px}.time{font-size:76px;font-weight:250;letter-spacing:-4px}.welcome{font-size:14px;margin-top:20px}.pin{display:flex;justify-content:center;gap:14px;margin:28px}.dot{width:10px;height:10px;border-radius:50%;border:1px solid #574652}.dot.on{background:#574652}.keys{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:12px}.key{border:0;border-radius:50%;height:58px;background:#ffffff9c;font-size:21px;color:#493843}.hint{font-size:12px;margin-top:20px;color:#806b79}.home{display:none;background:linear-gradient(160deg,#f9e9ef,#f0dce9 65%,#e4dff0)}.topline{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.greeting{text-align:center;margin:26px 0 25px;font-size:17px}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px}.app{border:0;background:none;color:#403540;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:6px}.ico{width:58px;height:58px;border-radius:18px;background:#ffffffc9;display:grid;place-items:center;font-size:27px;box-shadow:0 5px 14px #80607820}.dock{position:absolute;bottom:24px;left:18px;right:18px;border-radius:25px;background:#ffffff8c;padding:12px;display:flex;justify-content:space-around}.dock button{border:0;background:none;font-size:26px}.panel{display:none;position:absolute;inset:0;background:#fffafc;padding:22px 18px 30px;overflow:auto}.panel h2{margin:22px 0 14px}.back{border:0;background:#f4e5ec;border-radius:18px;padding:9px 14px}.bubble{padding:11px 14px;border-radius:17px;background:#f5e4ed;margin:10px 0;max-width:85%;font-size:14px}.bubble.me{margin-left:auto;background:#e9e1f3}.entry{display:flex;gap:7px;margin-top:15px}.entry input,.entry textarea{min-width:0;flex:1;border:1px solid #ead9e3;border-radius:14px;padding:10px;font:inherit}.entry button,.action{border:0;border-radius:14px;background:#eac9d9;padding:10px 14px;color:#493843}.note{width:100%;min-height:250px;border:0;background:#fff4f7;border-radius:18px;padding:14px;font:inherit}.tile{background:#fff;border-radius:18px;padding:14px;margin:10px 0}.small{color:#917b88;font-size:12px}
</style></head><body><main class="phone"><section class="screen lock" id="lock"><div class="status"><span>15:15 ◈</span><span>●●● ▰</span></div><div class="date">10월 22일 목요일</div><div class="time" id="clock">15:15</div><div class="welcome">사쿠의 작은 세계에 오신 걸 환영해요 ♡</div><div class="pin" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="keys" id="keys"></div><div class="hint">비밀번호 · 1118</div></section>
<section class="screen home" id="home"><div class="topline"><span>15:15</span><span>●●● ▰</span></div><div class="greeting">오늘도 사쿠와 함께 ♡</div><div class="apps">
<button class="app" onclick="openPanel('chat')"><span class="ico">💬</span>메시지</button><button class="app" onclick="openPanel('line')"><span class="ico">🟩</span>LINE</button><button class="app" onclick="openPanel('weverse')"><span class="ico">💜</span>Weverse</button><button class="app" onclick="openPanel('insta')"><span class="ico">📷</span>Instagram</button><button class="app" onclick="openPanel('x')"><span class="ico">𝕏</span>X</button><button class="app" onclick="openPanel('youtube')"><span class="ico">▶️</span>YouTube</button><button class="app" onclick="openPanel('spotify')"><span class="ico">🎧</span>Spotify</button><button class="app" onclick="openPanel('photos')"><span class="ico">🌷</span>사진</button><button class="app" onclick="openPanel('notes')"><span class="ico">📝</span>메모</button><button class="app" onclick="openPanel('calendar')"><span class="ico">📅</span>캘린더</button><button class="app" onclick="openPanel('clockapp')"><span class="ico">⏰</span>시계</button><button class="app" onclick="openPanel('settings')"><span class="ico">⚙️</span>설정</button></div><div class="dock"><button onclick="openPanel('phone')">📞</button><button onclick="openPanel('chat')">💬</button><button onclick="openPanel('safari')">🧭</button><button onclick="openPanel('photos')">🌸</button></div></section>
<div class="panel" id="panel"><button class="back" onclick="closePanel()">‹ 홈 화면</button><div id="panelbody"></div></div></main>
<script>
let pin='';const keys=document.getElementById('keys');['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{let b=document.createElement('button');b.className='key';b.textContent=k;b.onclick=()=>press(k);keys.append(b)});
function press(k){if(k==='⌫')pin=pin.slice(0,-1);else if(k==='✓'){if(pin==='1118'){document.getElementById('lock').style.display='none';document.getElementById('home').style.display='block'}else pin=''}else if(pin.length<4)pin+=k;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i<pin.length))}
function openPanel(which){let p=document.getElementById('panel'),b=document.getElementById('panelbody');p.style.display='block';let titles={chat:'메시지',line:'LINE',weverse:'Weverse',insta:'Instagram',x:'X',youtube:'YouTube',spotify:'Spotify',photos:'사진',notes:'메모',calendar:'캘린더',clockapp:'시계',settings:'설정',phone:'전화',safari:'Safari'};let html='<h2>'+titles[which]+'</h2>';
if(which==='chat'||which==='line'){html+='<div id="msgs"><div class="bubble">사쿠：오늘도 와줘서 고마워요 ♡</div><div class="bubble me">오늘도 응원하고 있어!</div></div><div class="entry"><input id="msg" placeholder="메시지 입력"><button onclick="sendMsg()">전송</button></div>'}
else if(which==='notes'){html+='<textarea class="note" id="note" placeholder="사쿠에게 남기고 싶은 메모..."></textarea><p class="small">메모는 이 기기에 자동 저장됩니다.</p>';setTimeout(()=>{let n=document.getElementById('note');n.value=localStorage.sakuNote||'';n.oninput=()=>localStorage.sakuNote=n.value},0)}
else if(which==='photos'){html+='<div class="tile">사진 보관함에 사진을 추가해 보세요 ♡<p><input type="file" accept="image/*" multiple onchange="preview(event)"></p><div id="preview"></div></div>'}
else if(which==='clockapp'){html+='<div class="tile"><h1 id="nowtime">--:--:--</h1>도쿄 · 서울</div>'}
else if(which==='calendar'){html+='<div class="tile"><h3>2026년 10월</h3>사쿠와 함께하는 오늘도 소중하게 ♡</div>'}
else if(which==='phone'){html+='<div class="tile"><h1>♡</h1><p>사쿠에게 마음으로 전화하기</p><div class="small">이곳은 시뮬레이션 전화 앱입니다.</div></div>'}
else if(which==='settings'){html+='<div class="tile">배경화면　　핑크 블라썸</div><div class="tile">암호　　1118</div><div class="tile">기기 이름　　사쿠의폰</div>'}
else if(which==='safari'){html+='<div class="tile">즐겨찾기</div><div class="tile"><a href="https://weverse.io/" target="_blank">Weverse</a></div><div class="tile"><a href="https://www.youtube.com/" target="_blank">YouTube</a></div><div class="tile"><a href="https://www.instagram.com/" target="_blank">Instagram</a></div>'}
else {html+='<div class="tile">사쿠의 업데이트를 기다리는 중... ♡</div><div class="tile small">이 화면为 팬메이드模拟界面，不连接真实账号。</div>'}
b.innerHTML=html;if(which==='clockapp'){let tick=()=>{let d=new Date();document.getElementById('nowtime').textContent=d.toLocaleTimeString('ko-KR',{timeZone:'Asia/Tokyo'})};tick();window.clockTick=setInterval(tick,1000)}}
function closePanel(){document.getElementById('panel').style.display='none';if(window.clockTick)clearInterval(window.clockTick)}
function sendMsg(){let i=document.getElementById('msg');if(!i.value.trim())return;let d=document.createElement('div');d.className='bubble me';d.textContent=i.value;document.getElementById('msgs').append(d);i.value=''}
function preview(e){let box=document.getElementById('preview');box.innerHTML='';[...e.target.files].forEach(f=>{let im=document.createElement('img');im.src=URL.createObjectURL(f);im.style='width:90px;height:90px;object-fit:cover;border-radius:12px;margin:4px';box.append(im)})}
</script></body></html>
