<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f5dfe8"><title>사쿠의폰</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5e8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;color:#17151a;display:grid;place-items:center;min-height:100svh}.device{width:min(402px,100vw);height:min(874px,100svh);min-height:620px;background:#111;border-radius:54px;padding:9px;box-shadow:0 22px 65px #51404d55;position:relative}.island{position:absolute;z-index:20;top:17px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:22px;background:#080808}.screen{height:100%;border-radius:46px;overflow:hidden;position:relative;background:#f8e9ef}.status{height:48px;padding:12px 27px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650;position:relative;z-index:5}.status .right{letter-spacing:2px}.lock{position:absolute;inset:0;color:white;text-align:center;background:linear-gradient(#0002,#0002),url('https://images.unsplash.com/photo-1770306924428-588e30d114f0?auto=format&fit=crop&fm=jpg&q=85&w=1600') center/cover}.lock:after{content:"";position:absolute;inset:0;background:linear-gradient(#0001,#0003 60%,#0004)}.lock>*{position:relative;z-index:1}.lock .status{color:#fff}.lockdate{margin-top:80px;font-size:19px;font-weight:500;text-shadow:0 1px 8px #555}.locktime{font-size:86px;font-weight:250;letter-spacing:-5px;line-height:1.15;text-shadow:0 2px 12px #555}.lockmsg{margin-top:10px;font-size:13px;text-shadow:0 1px 8px #555}.swipe{position:absolute;bottom:54px;left:0;right:0;font-size:13px;text-shadow:0 1px 8px #555;animation:bob 1.8s infinite}.chev{font-size:23px;display:block;margin-bottom:7px}@keyframes bob{50%{transform:translateY(-5px)}}.flash{position:absolute;bottom:24px;left:28px;width:46px;height:46px;border-radius:50%;background:#ffffff40;backdrop-filter:blur(10px);display:grid;place-items:center;font-size:20px}.camera{position:absolute;bottom:24px;right:28px;width:46px;height:46px;border-radius:50%;background:#ffffff40;backdrop-filter:blur(10px);display:grid;place-items:center;font-size:20px}.home{display:none;position:absolute;inset:0;background:linear-gradient(#f8e9efdd,#f0dce9ee),url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900') center/cover}.home .status{color:#26202a}.homehead{padding:28px 24px 18px;display:flex;justify-content:space-between;align-items:end}.homehead h2{font-size:24px;margin:0;font-weight:650}.homehead small{color:#74616e}.widget{margin:0 18px 25px;padding:16px 18px;background:#ffffffa8;backdrop-filter:blur(22px);border:1px solid #ffffff9c;border-radius:23px;display:flex;justify-content:space-between;align-items:center}.widget strong{font-size:30px;font-weight:500}.widget .saku{font-size:35px}.grid{padding:0 17px;display:grid;grid-template-columns:repeat(4,1fr);gap:21px 8px}.app{border:0;background:none;color:#302932;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;text-shadow:0 1px 5px white}.appicon{width:59px;height:59px;border-radius:17px;background:linear-gradient(145deg,#fff,#f4e7ee);box-shadow:0 5px 12px #73566b25;display:grid;place-items:center;font-size:27px;border:1px solid #fff9}.dock{position:absolute;bottom:17px;left:13px;right:13px;height:83px;border-radius:27px;background:#ffffff80;backdrop-filter:blur(22px);display:flex;justify-content:space-evenly;align-items:center}.dock .appicon{width:53px;height:53px}.appview{display:none;position:absolute;inset:0;background:#fffafc;z-index:8;overflow:auto;padding-bottom:30px}.appbar{height:60px;padding:16px 17px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee5eb;position:sticky;top:0;background:#fffafcf2;backdrop-filter:blur(15px);z-index:2}.appbar button{border:0;background:#f4e8ee;border-radius:18px;padding:8px 13px;color:#9a5e7b;font-size:14px}.appbar b{font-size:16px}.content{padding:18px}.content h2{font-size:27px;margin:5px 0 18px}.card{background:#f7edf2;border-radius:20px;padding:16px;margin:12px 0}.muted{color:#927f8b;font-size:12px}.chatrow{display:flex;gap:10px;align-items:center;padding:14px 3px;border-bottom:1px solid #f0e8ed}.avatar{width:43px;height:43px;border-radius:50%;background:#efd6e2;display:grid;place-items:center;font-size:20px}.msg{max-width:82%;padding:11px 14px;background:#f3e6ed;border-radius:18px;margin:9px 0;font-size:14px}.msg.me{background:#f4d8e5;margin-left:auto}.compose{display:flex;gap:8px;margin-top:15px}.compose input{flex:1;min-width:0;border:1px solid #eadde4;border-radius:22px;padding:12px;font:inherit}.compose button,.pill{border:0;border-radius:20px;background:#e9c9d8;padding:10px 15px;color:#624255}.notes{width:100%;min-height:65vh;border:0;outline:0;resize:none;background:#fff8e8;border-radius:18px;padding:18px;font:16px/1.7 -apple-system,sans-serif}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.homebar{position:absolute;z-index:15;bottom:8px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:5px;background:#ffffffdd}.appview .homebar{background:#222}.passcode{display:none;position:absolute;inset:0;z-index:12;background:#f6e9efed;backdrop-filter:blur(30px);text-align:center;padding-top:95px}.passcode h3{font-weight:500;font-size:20px}.dots{display:flex;justify-content:center;gap:17px;margin:24px}.dot{width:11px;height:11px;border:1px solid #554451;border-radius:50%}.dot.filled{background:#554451}.pad{display:grid;grid-template-columns:repeat(3,68px);justify-content:center;gap:13px}.pad button{height:62px;border:0;border-radius:50%;background:#ffffffb5;font-size:24px;color:#41323e}.toast{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:#222b;color:white;padding:8px 15px;border-radius:18px;font-size:12px;z-index:30;display:none}
</style></head><body><main class="device"><div class="island"></div><div class="screen" id="screen">
<section class="lock" id="lock"><div class="status"><span id="lockclock">15:15</span><span class="right">▮▮▮　◉　▰</span></div><div class="lockdate" id="lockdate">10月22日 星期四</div><div class="locktime" id="bigtime">15:15</div><div class="lockmsg">사쿠의 작은 세계에 오신 걸 환영해요 ♡</div><div class="flash">🔦</div><div class="camera">📷</div><div class="swipe" id="swipe"><span class="chev">⌃</span>向上轻扫以解锁</div></section>
<section class="passcode" id="passcode"><div class="status"><span id="pclock">15:15</span><span>▮▮▮　◉　▰</span></div><h3>输入密码</h3><div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="pad" id="pad"></div><p class="muted">提示：1118</p></section>
<section class="home" id="home"><div class="status"><span id="homeclock">15:15</span><span class="right">▮▮▮　◉　▰</span></div><div class="homehead"><div><small>10月22日 星期四</small><h2>사쿠의폰 ♡</h2></div><span>🌸</span></div><div class="widget"><div><small>今日心情</small><br><strong>좋은 하루!</strong><div class="muted">今天也要开心呀</div></div><span class="saku">🐰</span></div><div class="grid">
<button class="app" data-app="messages"><span class="appicon">💬</span>信息</button><button class="app" data-app="line"><span class="appicon">🟩</span>LINE</button><button class="app" data-app="weverse"><span class="appicon">💜</span>Weverse</button><button class="app" data-app="instagram"><span class="appicon">📸</span>Instagram</button><button class="app" data-app="x"><span class="appicon">𝕏</span>X</button><button class="app" data-app="youtube"><span class="appicon">▶️</span>YouTube</button><button class="app" data-app="spotify"><span class="appicon">🎧</span>Spotify</button><button class="app" data-app="photos"><span class="appicon">🌈</span>照片</button><button class="app" data-app="notes"><span class="appicon">📝</span>备忘录</button><button class="app" data-app="calendar"><span class="appicon">📅</span>日历</button><button class="app" data-app="clock"><span class="appicon">⏰</span>时钟</button><button class="app" data-app="settings"><span class="appicon">⚙️</span>设置</button></div><div class="dock"><button class="app" data-app="phone"><span class="appicon">📞</span></button><button class="app" data-app="messages"><span class="appicon">💬</span></button><button class="app" data-app="safari"><span class="appicon">🧭</span></button><button class="app" data-app="music"><span class="appicon">🎵</span></button></div></section>
<section class="appview" id="appview"><div class="appbar"><button id="back">‹ 主屏幕</button><b id="apptitle">应用</b><span>•••</span></div><div class="content" id="appcontent"></div><div class="homebar"></div></section><div class="toast" id="toast"></div><div class="homebar" id="homebar"></div></div></main>
<script>
const $=id=>document.getElementById(id);let pin='',startY=0,appName='';
function updateTime(){const d=new Date();const t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('lockclock').textContent=$('pclock').textContent=$('homeclock').textContent=t;$('bigtime').textContent=t;$('lockdate').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
updateTime();setInterval(updateTime,10000);
const lock=$('lock');function beginUnlock(){$('passcode').style.display='block';pin='';dots()}
lock.addEventListener('touchstart',e=>startY=e.touches[0].clientY);lock.addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>35)beginUnlock()});lock.addEventListener('mousedown',e=>startY=e.clientY);lock.addEventListener('mouseup',e=>{if(startY-e.clientY>35)beginUnlock()});$('swipe').onclick=beginUnlock;
['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k==='⌫')pin=pin.slice(0,-1);else if(k==='✓'){if(pin==='1118'){$('passcode').style.display='none';lock.style.display='none';$('home').style.display='block';$('homebar').style.background='#fff'}else{pin='';toast('密码不正确，请重试')}}else if(pin.length<4)pin+=k;dots()};$('pad').append(b)});
function dots(){$('dots').innerHTML=[0,1,2,3].map(i=>'<i class="dot '+(i<pin.length?'filled':'')+'"></i>').join('')}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}
const titles={messages:'信息',line:'LINE',weverse:'Weverse',instagram:'Instagram',x:'X',youtube:'YouTube',spotify:'Spotify',photos:'照片',notes:'备忘录',calendar:'日历',clock:'时钟',settings:'设置',phone:'电话',safari:'Safari',music:'音乐'};
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
function openApp(name){appName=name;$('apptitle').textContent=titles[name]||name;$('appcontent').innerHTML=render(name);$('appview').style.display='block';$('homebar').style.display='none';if(name==='notes'){$('noteText').value=localStorage.sakuNotes||'';$('noteText').oninput=e=>localStorage.sakuNotes=e.target.value}if(name==='clock')tickClock()}
$('back').onclick=closeApp;function closeApp(){$('appview').style.display='none';$('homebar').style.display='block'}
function render(n){if(n==='messages'||n==='line')return '<h2>对话</h2><div class="chatrow"><div class="avatar">🐰</div><div><b>사쿠</b><div class="muted">今天也要一起度过美好的一天 ♡</div></div></div><div id="chatlog"><div class="msg">사쿠：今天有好好吃饭吗？</div><div class="msg me">有！一直在为你加油 ♡</div><div class="msg">사쿠：那就好，明天也要见面哦。</div></div><div class="compose"><input id="chatinput" placeholder="iMessage"><button onclick="sendChat()">发送</button></div>';
if(n==='notes')return '<h2>备忘录</h2><textarea class="notes" id="noteText" placeholder="记录想对咲哉说的话…"></textarea><p class="muted">自动保存在此设备</p>';
if(n==='photos')return '<h2>照片</h2><div class="card">选择你想放进相册的照片 ♡<p><input type="file" accept="image/*" multiple onchange="addPhotos(event)"></p><div class="photoGrid" id="photoGrid"></div></div>';
if(n==='calendar')return '<h2>日历</h2><div class="card"><h1>22</h1>星期四 · 10月<br><p>♡ 想念咲哉的每一天</p></div>';
if(n==='clock')return '<h2>时钟</h2><div class="card"><h1 id="tokyo">--:--:--</h1>东京 · 日本标准时间</div><div class="card">闹钟　　＋</div>';
if(n==='phone')return '<h2>个人收藏</h2><div class="card" style="text-align:center"><div style="font-size:55px">🐰</div><b>사쿠</b><p class="muted">模拟电话界面</p><button class="pill" onclick="toast(\'这是粉丝模拟电话哦 ♡\')">拨打</button></div>';
if(n==='settings')return '<h2>设置</h2>'+['飞行模式','Wi‑Fi','蓝牙','通知','墙纸','密码：1118','关于本机 · 사쿠의폰'].map(x=>'<div class="card">'+x+'　›</div>').join('');
if(n==='safari')return '<h2>收藏</h2>'+[['Weverse','https://weverse.io/'],['YouTube','https://youtube.com/'],['Instagram','https://instagram.com/'],['Spotify','https://open.spotify.com/']].map(x=>'<a class="card" style="display:block;color:#8a5470;text-decoration:none" href="'+x[1]+'" target="_blank">'+x[0]+'　↗</a>').join('');
if(n==='music'||n==='spotify')return '<h2>正在播放</h2><div class="card" style="text-align:center"><div style="font-size:90px">🎧</div><h3>사쿠의 플레이리스트</h3><p class="muted">为今天准备的音乐</p><button class="pill" onclick="toast(\'打开 Spotify 播放音乐\')">♡ 喜欢</button></div>';
const links={weverse:'https://weverse.io/',instagram:'https://instagram.com/',x:'https://x.com/',youtube:'https://youtube.com/'};return '<h2>'+titles[n]+'</h2><div class="card">사쿠의 업데이트를 기다리는 중… ♡<p class="muted">这是粉丝制作的模拟界面，不连接真实账号。</p><a href="'+(links[n]||'#')+'" target="_blank">打开官方应用网站 ↗</a></div>'}
function sendChat(){const i=$('chatinput');if(!i||!i.value.trim())return;const d=document.createElement('div');d.className='msg me';d.textContent=i.value;$('chatlog').append(d);i.value=''}
function addPhotos(e){const g=$('photoGrid');[...e.target.files].forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);g.append(im)})}
function tickClock(){const el=$('tokyo');if(el)el.textContent=new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Tokyo'})}
</script></div></main></body></html>
