<!doctype html>
<html lang="ko-KR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>사쿠의폰 · Sakuya's Phone</title>
<style>
/* =========================================================
   RESET & BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#0b0b0d;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",
  "Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#17151a;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;border:0;outline:0}
img{display:block;max-width:100%}
:root{
  --pink:#f8b3c8;--pink-soft:#fde6ef;--pink-deep:#c96f90;
  --wallpaper1:url('https://images.unsplash.com/photo-1770306924428-588e30d114f0?auto=format&fit=crop&fm=jpg&q=85&w=1600');
  --wallpaper2:url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1400&q=90');
}

/* =========================================================
   DEVICE FRAME
   ========================================================= */
.device{
  position:relative;width:100vw;height:100dvh;
  max-width:430px;margin:0 auto;background:#0a0a0c;
  box-shadow:0 0 60px #000;overflow:hidden;
}
@media(min-width:431px){
  body{display:grid;place-items:center;background:radial-gradient(circle at center,#2a2530,#0a0a0c 80%)}
  .device{height:min(900px,95dvh);border-radius:56px;padding:9px;
    box-shadow:0 30px 80px #000,0 0 0 2px #1f1a22 inset}
  .device::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:122px;height:36px;border-radius:22px;background:#000;z-index:1000}
}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:#f8e9ef}

/* =========================================================
   STATUS BAR
   ========================================================= */
.status{
  height:44px;padding:14px 26px 0;display:flex;justify-content:space-between;
  align-items:center;font-size:14px;font-weight:600;position:relative;z-index:10
}
.status .right{letter-spacing:2px;display:flex;gap:5px;align-items:center}
.status .right .signal::before{content:"▮▮▮";letter-spacing:-1px}
.status .right .carrier{font-size:12px;font-weight:500}
.status .right .battery{display:inline-block;width:24px;height:11px;border:1px solid currentColor;
  border-radius:3px;position:relative;margin-left:2px;opacity:.9}
.status .right .battery::before{content:"";position:absolute;top:1px;left:1px;bottom:1px;right:4px;
  background:currentColor;border-radius:1px}
.status .right .battery::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;
  background:currentColor;border-radius:0 1px 1px 0}
.status.dark{color:#fff}

/* =========================================================
   LOCK SCREEN
   ========================================================= */
#lock{
  position:absolute;inset:0;color:#fff;text-align:center;z-index:10;
  background:
    linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 28%,rgba(0,0,0,.15) 62%,rgba(0,0,0,.35) 100%),
    var(--wallpaper1) center/cover no-repeat;
  transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1);
}
#lock.hidden{opacity:0;transform:scale(1.05);pointer-events:none;visibility:hidden;transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),visibility 0s .6s}
.lockdate{margin-top:90px;font-size:20px;font-weight:500;letter-spacing:.3px;
  text-shadow:0 2px 20px rgba(0,0,0,.45)}
.locktime{font-size:clamp(92px,24vw,116px);font-weight:250;letter-spacing:-7px;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 3px 30px rgba(0,0,0,.5);margin-top:2px}
.lockmsg{
  display:inline-block;margin-top:14px;padding:9px 18px;
  border:1px solid rgba(255,255,255,.45);border-radius:22px;
  background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  font-size:13px;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.3)
}
.lock-widgets{
  position:absolute;left:20px;right:20px;top:255px;
  display:flex;gap:12px
}
.lock-widgets .lw{
  flex:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  border-radius:18px;padding:10px 12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  text-align:left;font-size:11px
}
.lock-widgets .lw b{display:block;font-size:14px;margin-top:2px}
.flash,.camera{
  position:absolute;bottom:30px;width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:18px
}
.flash{left:28px}.camera{right:28px}
.swipe-hint{
  position:absolute;bottom:86px;left:0;right:0;font-size:12px;font-weight:500;
  text-shadow:0 1px 8px rgba(0,0,0,.5);animation:swipeBob 2s ease-in-out infinite;
  touch-action:none;cursor:pointer
}
.swipe-hint .chev{display:block;font-size:22px;font-weight:700;margin-bottom:4px;
  animation:chevrondown 1.6s ease-in-out infinite}
@keyframes chevrondown{0%,100%{transform:translateY(-4px);opacity:.4}50%{transform:translateY(4px);opacity:1}}
@keyframes swipeBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* =========================================================
   PASSCODE
   ========================================================= */
#passcode{
  position:absolute;inset:0;z-index:15;text-align:center;padding-top:0;
  background:
    linear-gradient(rgba(20,16,25,.4),rgba(20,16,25,.55)),
    var(--wallpaper2) center/cover no-repeat;color:#fff;
  display:none;flex-direction:column;align-items:center;
  transform:translateY(100%);transition:transform .45s cubic-bezier(.22,1,.36,1)
}
#passcode.show{display:flex;transform:translateY(0)}
#passcode.shake{animation:shake .45s ease}
@keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}
  30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
#passcode::before{content:"";position:absolute;inset:0;background:rgba(18,15,22,.45);
  backdrop-filter:blur(36px);-webkit-backdrop-filter:blur(36px);pointer-events:none;z-index:0}
#passcode>*{position:relative;z-index:1}
.passcode-head h3{font-size:20px;font-weight:550;margin:44px 0 0}
.dots{display:flex;justify-content:center;gap:18px;margin:28px 0 30px}
.dot{width:11px;height:11px;border:1.2px solid rgba(255,255,255,.85);
  border-radius:50%;background:transparent;transition:all .15s}
.dot.filled{background:#fff;transform:scale(1.1)}
.dot.wrong{background:#ff5a5f;border-color:#ff5a5f;animation:dotWrong .3s}
@keyframes dotWrong{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
.pad{
  display:grid;grid-template-columns:repeat(3,minmax(0,74px));
  gap:12px 18px;justify-content:center;align-items:center;margin-top:4px
}
.pad button{
  width:72px;height:72px;border-radius:50%;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
  color:#fff;font-size:30px;font-weight:300;letter-spacing:-1px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:transform .15s,background .15s;touch-action:manipulation
}
.pad button:active{background:rgba(255,255,255,.55);transform:scale(.93)}
.pad-empty{width:72px;height:72px}
.pad .delete-key{
  background:transparent;border:0;font-size:13px;font-weight:500;
  backdrop-filter:none;-webkit-backdrop-filter:none
}
.passcode .muted{color:rgba(255,255,255,.8);margin-top:22px;font-size:12px}
.passcode-footer{margin-top:auto;padding-bottom:38px;display:flex;gap:32px;
  color:rgba(255,255,255,.8);font-size:11px}
@media(max-height:700px){
  .passcode-head h3{margin-top:26px}.dots{margin:16px 0 22px}
  .pad{gap:8px 14px}.pad button,.pad-empty{width:62px;height:62px;font-size:26px}
}

/* =========================================================
   HOME SCREEN
   ========================================================= */
#home{
  position:absolute;inset:0;display:none;flex-direction:column;z-index:8;
  background:
    linear-gradient(180deg,rgba(248,233,239,.65),rgba(240,220,233,.8)),
    var(--wallpaper2) center/cover no-repeat;
  animation:homeIn .5s cubic-bezier(.22,1,.36,1) both;
}
#home.show{display:flex;animation:homeIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes homeIn{from{opacity:0;transform:scale(.97) translateY(20px)}to{opacity:1;transform:none}}
.home-title{padding:10px 24px 4px;display:flex;justify-content:space-between;align-items:center}
.home-title small{color:#74616e;font-size:11px}
.home-title h2{font-size:26px;margin:4px 0 0;font-weight:700;letter-spacing:.5px}
.home-title .emo{font-size:28px}

/* Widget */
.widget{
  margin:14px 18px 20px;padding:14px 18px;border-radius:22px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.9);
  display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 4px 20px rgba(180,130,150,.15);
  animation:widgetIn .7s .1s cubic-bezier(.22,1,.36,1) both
}
@keyframes widgetIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.widget strong{font-size:26px;font-weight:500;display:block;margin:2px 0}
.widget .saku{font-size:38px}

/* App grid */
.grid{
  flex:1;padding:8px 16px 0;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:18px 4px;align-content:start;
  animation:gridIn .7s .2s cubic-bezier(.22,1,.36,1) both
}
@keyframes gridIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.app{
  border:0;background:none;color:#302932;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:11px;font-weight:500;text-shadow:0 1px 3px rgba(255,255,255,.6);
  transition:transform .15s
}
.app:active{transform:scale(.9)}
.appicon{
  width:60px;height:60px;border-radius:16px;
  background:linear-gradient(145deg,#fff,#f4e7ee);
  box-shadow:0 4px 12px rgba(115,86,107,.25),inset 0 0 0 1px rgba(255,255,255,.9);
  display:grid;place-items:center;font-size:26px;position:relative;overflow:hidden
}
.appicon.kakao{background:#fee500!important;color:#191919}
.appicon.kakao::after{
  content:"";width:30px;height:22px;background:#191919;border-radius:50%;
  clip-path:polygon(0 0,100% 0,100% 78%,42% 78%,22% 100%,24% 78%,0 78%);
  box-shadow:-1px -1px 0 #fee500
}
.appicon.spotify{background:#000!important;color:#1ed760}
.appicon.spotify::after{
  content:"";position:relative;width:30px;height:30px;border-radius:50%;
  box-shadow:inset 0 0 0 0 #1ed760,0 2px 0 0 #1ed760,0 8px 0 -2px #1ed760,0 14px 0 -4px #1ed760
}

/* Dock */
.dock{
  margin:10px 14px 18px;height:78px;border-radius:28px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.75);
  display:flex;justify-content:space-evenly;align-items:center;
  animation:dockIn .7s .3s cubic-bezier(.22,1,.36,1) both
}
@keyframes dockIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.dock .appicon{width:52px;height:52px;border-radius:14px;box-shadow:none}

/* =========================================================
   APP VIEW (overlay)
   ========================================================= */
#appview{
  position:absolute;inset:0;display:none;flex-direction:column;z-index:9;
  background:#fff;overflow:hidden;border-radius:inherit;
  animation:appIn .35s cubic-bezier(.22,1,.36,1) both
}
#appview.show{display:flex}
#appview.closing{animation:appOut .3s cubic-bezier(.4,0,1,1) both}
@keyframes appIn{from{opacity:.95;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes appOut{from{opacity:1;transform:none}to{opacity:.95;transform:scale(1.04) translateY(20px)}}
.appbar{
  flex-shrink:0;height:58px;padding:8px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,0,0,.06);position:sticky;top:0;z-index:2
}
.appbar.darkbar{background:#121212;color:#fff;border-color:#222}
.appbar .back{
  display:flex;align-items:center;gap:2px;
  background:rgba(0,0,0,.06);border-radius:18px;padding:6px 12px;
  font-size:13px;color:#c96f90;font-weight:500
}
.appbar.darkbar .back{background:rgba(255,255,255,.12);color:#fff}
.appbar .title{font-size:16px;font-weight:600}
.appbar .more{color:#999;font-size:18px;padding:4px 8px}
.appcontent{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:#fff}
.kakao-app .appcontent{background:#fff}
.appcontent h2{font-size:28px;margin:6px 0 14px;font-weight:700}
.appcontent h3{font-size:18px;margin:18px 0 10px;font-weight:600}
.muted{color:#927f8b;font-size:12px}
.appview .homebar{background:#222!important}

/* =========================================================
   MESSAGES / CHAT
   ========================================================= */
.chatlist-item{
  display:flex;gap:12px;align-items:center;padding:12px 18px;
  border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer
}
.chatlist-item:active{background:rgba(0,0,0,.03)}
.avatar{width:46px;height:46px;border-radius:50%;background:#f5d9e5;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.chatlist-item .meta{flex:1;min-width:0}
.chatlist-item b{display:block;font-size:15px;font-weight:600}
.chatlist-item .last{color:#8a7c85;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatlist-item time{font-size:11px;color:#aaa;flex-shrink:0}
#chatlog{padding:12px 16px;min-height:60vh}
.msg{max-width:78%;padding:10px 14px;background:#f3e6ed;border-radius:20px;margin:6px 0;font-size:14px;line-height:1.45;word-wrap:break-word}
.msg.me{background:#e9a8c2;margin-left:auto;border-bottom-right-radius:5px}
.msg.them{border-bottom-left-radius:5px}
.msg-time{display:flex;gap:6px;align-items:flex-end;margin:10px 0 4px}
.msg-time.me{justify-content:flex-end}
.msg-time .tm{font-size:10px;color:#bbb;margin-bottom:2px}
.msg-date{text-align:center;color:#aaa;font-size:11px;margin:16px 0 8px}
.compose{display:flex;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid #eee}
.compose input{flex:1;min-width:0;border:1px solid #eadde4;border-radius:20px;padding:10px 14px;font-size:14px;background:#faf5f8}
.compose button{border-radius:20px;background:#e9a8c2;padding:10px 16px;color:#fff;font-weight:600;font-size:13px}
.compose button:active{opacity:.85}

/* =========================================================
   KAKAOTALK
   ========================================================= */
.kakao-app .appbar{background:#fee500;border-color:rgba(0,0,0,.06)}
.kakao-app .appbar .back{background:rgba(0,0,0,.07);color:#191919}
.kt-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 16px;background:#fee500}
.kt-head h2{margin:0;font-size:26px;font-weight:800;color:#191919}
.kt-head .actions{display:flex;gap:16px;color:#191919;font-size:18px}
.kt-tabs{display:flex;gap:22px;border-bottom:1px solid #eee;padding:10px 18px;background:#fff;font-size:14px;color:#888}
.kt-tabs b{color:#191919;border-bottom:2px solid #191919;padding-bottom:10px}
.kt-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #f2edf0;cursor:pointer}
.kt-row:active{background:#fafafa}
.kt-avatar{width:48px;height:48px;border-radius:14px;background:#f5d9e5;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.kt-row .info{flex:1;min-width:0}
.kt-row b{display:block;font-size:15px;color:#191919}
.kt-row .last{color:#9a9397;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt-row time{font-size:11px;color:#bbb;flex-shrink:0}
.kt-bottom{
  position:absolute;bottom:0;left:0;right:0;background:#fff;
  display:flex;justify-content:space-around;padding:10px 0 22px;border-top:1px solid #eee
}
.kt-bottom span{text-align:center;font-size:11px;color:#777}
.kt-bottom b{display:block;font-size:22px;color:#333;margin-bottom:2px;font-weight:400}
.kt-chat-head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fee500;border-bottom:1px solid #e2d000}
.kt-chat-head .back{font-size:22px;color:#191919;padding:0 6px}
.kt-chat-head .kt-avatar{width:38px;height:38px;border-radius:12px}
.kt-chat-head b{font-size:15px;color:#191919}
.kt-chat-head .right{margin-left:auto;display:flex;gap:16px;color:#191919;font-size:18px}
.kt-chat-bg{background:#abc5d8;padding:12px;min-height:55vh}
.kt-bubble{background:#fff;border-radius:3px 14px 14px 14px;padding:9px 12px;margin:8px 0;max-width:80%;font-size:14px;color:#191919;line-height:1.4}
.kt-bubble.me{background:#fee500;border-radius:14px 3px 14px 14px;margin-left:auto}
.kt-chat-date{text-align:center;color:rgba(0,0,0,.45);font-size:11px;margin:14px 0}
.kt-compose{display:flex;gap:8px;padding:10px;background:#fee500;border-top:1px solid #e2d000}
.kt-compose input{flex:1;min-width:0;border-radius:18px;padding:9px 14px;background:#fff;border:1px solid #e2d000;font-size:14px}
.kt-compose button{border-radius:14px;background:#191919;color:#fee500;padding:8px 14px;font-weight:700;font-size:13px}
.kt-emoji-bar{display:flex;gap:10px;padding:8px 14px;background:#f5dd00;border-top:1px solid #e2d000;font-size:22px}

/* =========================================================
   SPOTIFY
   ========================================================= */
.spotify-app #appview{background:#121212}
.spotify-app .appbar{background:#121212;color:#fff;border-color:#121212}
.spotify-app .appbar .back{background:rgba(255,255,255,.12);color:#fff}
.spotify-app .appcontent{background:linear-gradient(180deg,#1f1f25 0%,#121212 250px);background-color:#121212;color:#fff;padding:0}
.sp-top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
.sp-top b{font-size:26px;font-weight:800}
.sp-top .actions{display:flex;gap:16px;font-size:18px;color:#ddd}
.sp-chips{display:flex;gap:8px;padding:0 18px;margin:14px 0 4px;flex-wrap:wrap}
.sp-chip{border-radius:18px;background:#333;padding:7px 14px;font-size:12px;color:#fff;font-weight:600}
.sp-chip.active{background:#fff;color:#000}
.sp-section{padding:10px 18px 14px}
.sp-section h2{font-size:22px;margin:8px 0;font-weight:700}
.sp-card{
  display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);
  border-radius:6px;overflow:hidden;margin:7px 0;padding:0;font-weight:600;
  transition:background .15s;cursor:pointer
}
.sp-card:active{background:rgba(255,255,255,.15)}
.sp-cover{width:64px;height:64px;display:grid;place-items:center;
  background:linear-gradient(135deg,#e7b8cb,#59445b);font-size:26px;flex-shrink:0}
.sp-cover.alt2{background:linear-gradient(135deg,#9d6c87,#251a29);font-size:24px}
.sp-cover.alt3{background:linear-gradient(135deg,#b8a2d6,#40344d);font-size:24px}
.sp-card .info{flex:1;min-width:0;padding-right:14px}
.sp-card .info b{font-size:14px;display:block;font-weight:600;color:#fff}
.sp-card .info small{color:#aaa;font-size:12px}
.sp-track-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.sp-track-row .num{width:18px;color:#aaa;text-align:right;font-size:12px}
.sp-track-row .info{flex:1;min-width:0}
.sp-track-row b{display:block;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-track-row small{color:#aaa;font-size:12px}
.sp-track-row .dur{color:#aaa;font-size:12px}

/* Player */
.sp-player{display:flex;flex-direction:column;min-height:100%;background:linear-gradient(180deg,#3a2530,#121212 60%);color:#fff;padding:16px 22px 100px}
.sp-player-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sp-player-head .back{font-size:22px;color:#fff;padding:4px 8px;border-radius:50%;background:rgba(255,255,255,.08)}
.sp-player-head .title{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:1px;text-align:center}
.sp-album-placeholder{width:100%;aspect-ratio:1;border-radius:8px;
  background:linear-gradient(135deg,#e5b4cb,#30202f);display:grid;place-items:center;font-size:110px;margin:10px 0;
  box-shadow:0 20px 40px rgba(0,0,0,.5)}
.sp-track-title{margin-top:12px}
.sp-track-title h2{font-size:22px;margin:4px 0 2px;font-weight:700}
.sp-track-title .artist{color:#aaa;font-size:14px}
.sp-track-title .like{float:right;font-size:22px;color:#aaa}
.sp-progress{height:4px;background:#555;border-radius:3px;margin:18px 0;position:relative;cursor:pointer}
.sp-progress .played{height:100%;background:#fff;border-radius:3px;position:relative}
.sp-progress .played::after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;background:#fff;border-radius:50%}
.sp-times{display:flex;justify-content:space-between;color:#aaa;font-size:11px}
.sp-controls{display:flex;align-items:center;justify-content:space-between;font-size:22px;padding:18px 0;color:#fff}
.sp-controls .shuffle,.sp-controls .repeat{color:#aaa;font-size:20px}
.sp-play-btn{width:60px;height:60px;border-radius:50%;background:#1ed760;color:#000;display:grid;place-items:center;font-size:26px;border:0;margin:0 8px}
.sp-play-btn:active{transform:scale(.93)}
.sp-footer{display:flex;justify-content:space-around;color:#aaa;font-size:12px;margin-top:20px}

/* Bottom now-playing bar inside spotify */
.sp-nowbar{
  position:absolute;bottom:70px;left:12px;right:12px;
  background:rgba(40,40,45,.95);border-radius:8px;padding:8px 12px;
  display:flex;align-items:center;gap:10px;backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);z-index:3
}
.sp-nowbar .smallcover{width:40px;height:40px;border-radius:4px;font-size:16px;
  background:linear-gradient(135deg,#e5b4cb,#30202f);display:grid;place-items:center}
.sp-nowbar b{font-size:13px;flex:1;min-width:0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-nowbar .btn{font-size:22px;color:#fff;padding:0 6px}

/* Spotify miniplayer (global persistent) */
.sp-mini{
  position:absolute;left:10px;right:10px;bottom:60px;z-index:20;
  background:rgba(36,36,40,.95);border-radius:10px;padding:6px 10px;
  display:none;align-items:center;gap:10px;backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 6px 16px rgba(0,0,0,.4)
}
.sp-mini.show{display:flex}
.sp-mini .smallcover{width:34px;height:34px;border-radius:4px;font-size:14px;
  background:linear-gradient(135deg,#e5b4cb,#30202f);display:grid;place-items:center;flex-shrink:0}
.sp-mini b{font-size:12px;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-mini .btn{font-size:20px;color:#fff;padding:4px}

/* =========================================================
   OTHER APPS
   ========================================================= */
.card{background:#f7edf2;border-radius:18px;padding:16px;margin:12px 16px}
.card a{color:inherit;text-decoration:none}
.notes{width:100%;min-height:60vh;border:0;outline:0;resize:none;background:#fff8e8;
  border-radius:16px;padding:16px;font:16px/1.7 -apple-system,sans-serif}
.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 16px 20px}
.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}
.clock-face{font-size:52px;font-weight:200;letter-spacing:-2px;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.pill{border:0;border-radius:20px;background:#e9a8c2;padding:10px 22px;color:#fff;font-weight:600}

/* =========================================================
   HOME INDICATOR / TOAST / FLASH
   ========================================================= */
.homebar{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:5px;
  background:rgba(255,255,255,.9);z-index:50
}
#appview.show ~ .homebar,.homebar-dark{background:#222!important}
#appview.show ~ .homebar{display:block}
.homebar.hidden{display:none}
.toast{
  position:absolute;top:58px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,20,.92);color:#fff;padding:8px 16px;border-radius:20px;
  font-size:12px;z-index:30;display:none;pointer-events:none;
  animation:toastIn .25s cubic-bezier(.22,1,.36,1) both
}
.toast.show{display:block}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.flash-overlay{position:absolute;inset:0;background:#000;z-index:200;display:none;animation:flashOn .2s}
@keyframes flashOn{from{opacity:0}to{opacity:1}}
.flash-overlay.off{animation:flashOff .3s forwards}
@keyframes flashOff{from{opacity:1}to{opacity:0}}

/* Safari quick */
.saf-list{margin:14px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.saf-list a{display:block;background:#fff;border:1px solid #eee;border-radius:14px;
  padding:14px;text-decoration:none;color:#c96f90;font-weight:600;font-size:14px}
.saf-list a .icon{font-size:26px;margin-bottom:6px;display:block}

/* Settings list */
.set-group{margin:14px 16px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee}
.set-item{padding:12px 14px;border-bottom:1px solid #f0e8ed;display:flex;align-items:center;gap:12px;font-size:14px}
.set-item:last-child{border-bottom:0}
.set-item .ico{width:28px;height:28px;border-radius:6px;background:#fde6ef;display:grid;place-items:center;font-size:14px}
.set-item .val{margin-left:auto;color:#bbb;font-size:12px}
.set-item .chev{color:#ccc;margin-left:4px}

/* Safari browser view */
.browser{background:#fff;display:flex;flex-direction:column;height:100%}
.browser-bar{display:flex;gap:8px;padding:8px 12px;background:#f6f6f8;border-bottom:1px solid #e5e5ea;align-items:center}
.browser-bar .url{flex:1;background:#fff;border:1px solid #e5e5ea;border-radius:8px;padding:6px 10px;font-size:13px;color:#333}
.browser-bar button{background:none;font-size:18px;color:#007aff;padding:2px 8px}
.browser-frame{flex:1;overflow:hidden;background:#fff}
.browser-frame iframe{width:100%;height:100%;border:0}
.browser-home{padding:18px;text-align:center}
.browser-home .big{font-size:48px}

/* =========================================================
   ANIMATIONS / TRANSITIONS
   ========================================================= */
.app-open-tile{animation:tilePop .45s cubic-bezier(.22,1,.36,1)}
@keyframes tilePop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}

/* Safe area padding for real devices */
@supports(padding:max(0px)){
  .status{padding-top:max(14px,env(safe-area-inset-top))}
  .homebar{bottom:max(6px,env(safe-area-inset-bottom))}
}
</style>
</head>

<script>
/* ================================================================
   SAKUYA'S PHONE — Full interactive simulated iPhone
   ================================================================ */
const $ = id => document.getElementById(id);
const device = $('device'), screen = $('screen');

/* ---------- Time ---------- */
function updateTime(){
  const d = new Date();
  const t = d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
  const dateStr = d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  ['lockclock','pclock','homeclock','bigtime'].forEach(id=>{ const el=$(id); if(el) el.textContent=t; });
  if($('lockdate')) $('lockdate').textContent=dateStr;
  if($('homeDate')) $('homeDate').textContent=dateStr;
}
updateTime(); setInterval(updateTime,5000);

/* ---------- Lock → Passcode ---------- */
let startY=null, unlockProgress=0;
const lock=$('lock'), pass=$('passcode'), swipe=$('swipeHint');

function openPasscode(){
  if(pass.classList.contains('show')) return;
  lock.classList.add('hidden');
  pass.classList.add('show');
  setTimeout(()=>pass.querySelector('button[data-key]')?.focus?.(),300);
}
function showLock(){
  lock.classList.remove('hidden');
  pass.classList.remove('show');
  resetDots(); pin='';
}
// swipe up gesture on lock
lock.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});
lock.addEventListener('touchmove',e=>{
  if(startY===null)return;
  const dy=startY-e.touches[0].clientY;
  if(dy>0) lock.style.transform=`translateY(${dy*0.3}px)`;
},{passive:true});
lock.addEventListener('touchend',e=>{
  if(startY===null)return;
  const dy=startY-e.changedTouches[0].clientY;
  lock.style.transform='';
  if(dy>30) openPasscode();
  startY=null;
},{passive:true});
lock.addEventListener('pointerdown',e=>{startY=e.clientY},{passive:true});
lock.addEventListener('pointerup',e=>{
  if(startY===null)return;
  const dy=startY-e.clientY;
  if(dy>28) openPasscode();
  startY=null;
});
swipe.addEventListener('click',openPasscode);
swipe.addEventListener('touchend',openPasscode,{passive:true});

/* ---------- Flashlight / Camera (doorbell buttons) ---------- */
$('flashBtn').addEventListener('click',()=>{
  const o=$('flashOverlay');
  o.style.display='block'; o.classList.remove('off');
  setTimeout(()=>{o.classList.add('off');setTimeout(()=>o.style.display='none',300)},1200);
  toast('手电筒 💡');
});
$('cameraBtn').addEventListener('click',()=>toast('카메라 · 相机 📷 (粉丝模拟)'));

/* ---------- Passcode ---------- */
const CORRECT_PIN = '1118';
let pin='';
const dotsEl=$('dots');
function resetDots(){
  dotsEl.innerHTML=[0,1,2,3].map(i=>'<i class="dot"></i>').join('');
}
function updateDots(wrong=false){
  const all=dotsEl.querySelectorAll('.dot');
  all.forEach((d,i)=>{ d.classList.remove('filled','wrong'); if(i<pin.length)d.classList.add(wrong?'wrong':'filled'); });
}
function shakePasscode(){ pass.classList.add('shake'); setTimeout(()=>pass.classList.remove('shake'),480); }
function pressKey(k){
  if(k==='⌫'){ pin=pin.slice(0,-1); updateDots(); return; }
  if(!/^\d$/.test(String(k)) || pin.length>=4) return;
  pin+=String(k); updateDots();
  if(pin.length===4) setTimeout(tryUnlock,180);
}
function tryUnlock(){
  if(pin===CORRECT_PIN){
    // Unlock animation
    pass.style.transform='translateY(100%)';
    setTimeout(()=>{
      $('home').classList.add('show');
      pass.classList.remove('show'); pass.style.transform='';
      // hide lock fully after animation
      lock.style.zIndex='0';
      // mini spotify show after a moment
      setTimeout(()=>$('spMini').classList.add('show'),600);
    },300);
  } else {
    shakePasscode(); updateDots(true); toast('密码错误 · 请重试');
    setTimeout(()=>{pin='';resetDots();},500);
  }
}
document.querySelectorAll('#pad button[data-key]').forEach(b=>{
  b.addEventListener('click',e=>{e.preventDefault();pressKey(b.dataset.key);});
  b.addEventListener('touchend',e=>{e.preventDefault();pressKey(b.dataset.key);},{passive:false});
});
// keyboard support on passcode
window.addEventListener('keydown',e=>{
  if(!pass.classList.contains('show')) return;
  if(/^\d$/.test(e.key)) pressKey(e.key);
  else if(e.key==='Backspace') pressKey('⌫');
});

/* ---------- Toast ---------- */
let toastTimer=null;
function toast(s){
  const t=$('toast'); t.textContent=s; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}

/* ================================================================
   HOME SCREEN & APP SWITCHING
   ================================================================ */
let currentApp=null, appStack=[], appTileAnim=null;
const appview=$('appview'), appcontent=$('appcontent'), apptitle=$('apptitle'), appbar=$('appbar'), backBtn=$('backBtn');
const titles = {
  messages:'信息', chat:'사쿠', kakao:'카카오톡', spotify:'Spotify', weverse:'Weverse',
  instagram:'Instagram', x:'X', youtube:'YouTube', photos:'照片',
  notes:'备忘录', calendar:'日历', clock:'时钟', settings:'设置',
  phone:'电话', safari:'Safari',
  kakaoChat:'사쿠', spotifyPlayer:'正在播放'
};

document.querySelectorAll('.app').forEach(btn=>{
  btn.addEventListener('click',e=>{
    const name=btn.dataset.app; if(!name) return;
    appTileAnim && clearTimeout(appTileAnim);
    btn.classList.add('app-open-tile');
    openApp(name);
    appTileAnim=setTimeout(()=>btn.classList.remove('app-open-tile'),460);
  });
});

function openApp(name, opts={}){
  appStack.push(name);
  currentApp=name;
  apptitle.textContent = titles[name] || name;
  appcontent.innerHTML = render(name, opts);
  appview.classList.remove('closing'); appview.classList.add('show');
  backBtn.textContent = appStack.length>1 ? '‹ 返回' : '‹ 主屏幕';
  // App-specific setup
  appview.classList.toggle('kakao-app', name.startsWith('kakao'));
  appview.classList.toggle('spotify-app', name.startsWith('spotify'));
  appbar.classList.toggle('darkbar', name==='spotifyPlayer');
  // After DOM update: wire up
  setTimeout(()=>wireApp(name,opts),0);
}

function closeApp(){
  appview.classList.add('closing');
  setTimeout(()=>{
    appview.classList.remove('show','closing','kakao-app','spotify-app');
    appbar.classList.remove('darkbar');
    appStack=[]; currentApp=null;
  },280);
}

backBtn.addEventListener('click',()=>{
  // pop this app from stack
  appStack.pop();
  if(appStack.length>0){
    // reopen previous
    const prev=appStack[appStack.length-1]; appStack.pop();
    openApp(prev);
  } else {
    closeApp();
  }
});

/* Home indicator swipe down (app close) */
let homeStartY=null;
screen.addEventListener('pointerdown',e=>{
  if(!appview.classList.contains('show')) return;
  homeStartY=e.clientY;
});
screen.addEventListener('pointerup',e=>{
  if(homeStartY===null) return;
  const dy=e.clientY-homeStartY;
  homeStartY=null;
  if(dy>80 && e.clientY>screen.clientHeight*0.75) closeApp();
});

/* ================================================================
   APP RENDERING
   ================================================================ */
function render(n,opts={}){
  switch(n){
    case 'messages': return renderMessages();
    case 'chat': return renderChat(opts.with||'sakuya');
    case 'kakao': return renderKakaoList();
    case 'kakaoChat': return renderKakaoChat(opts.with||'sakuya');
    case 'spotify': return renderSpotifyHome();
    case 'spotifyPlayer': return renderSpotifyPlayer();
    case 'notes': return renderNotes();
    case 'photos': return renderPhotos();
    case 'calendar': return renderCalendar();
    case 'clock': return renderClock();
    case 'phone': return renderPhone();
    case 'settings': return renderSettings();
    case 'safari': return renderSafari();
    case 'weverse':
    case 'instagram':
    case 'x':
    case 'youtube':
      return renderExternal(n);
    default: return '<h2>'+n+'</h2><div class="card">알 수 없는 화면 🌸</div>';
  }
}

/* ---------- Messages / iMessage ---------- */
const messagesStore = {
  sakuya:[
    {me:false,time:'15:02',text:'오늘도 와줘서 고마워요 ♡'},
    {me:true, time:'15:03',text:'今天也一直在支持你！🐰'},
    {me:false,time:'15:04',text:'밥 잘 챙겨 먹어요!'},
    {me:true, time:'15:05',text:'好！咲哉也要好好休息啊~'},
    {me:false,time:'15:06',text:'내일 또 볼 수 있죠? ✨'},
  ],
  fanclub:[
    {me:false,time:'14:58',text:'사쿠님 무대 진짜 최고였어요!'},
    {me:false,time:'14:59',text:'팬사인회 언제 해요 ㅠㅠ'},
  ]
};
function renderMessages(){
  return `
  <div class="chatlist-item" data-chat="sakuya"><div class="avatar">🐰</div><div class="meta"><b>사쿠</b><div class="last">오늘도 와줘서 고마워요 ♡</div></div><time>15:06</time></div>
  <div class="chatlist-item" data-chat="fanclub"><div class="avatar">🌸</div><div class="meta"><b>사쿠 팬방</b><div class="last">사쿠님 무대 진짜 최고였어요!</div></div><time>14:59</time></div>
  <div class="chatlist-item"><div class="avatar">🍑</div><div class="meta"><b>동생</b><div class="last">照片</div></div><time>昨天</time></div>
  <div class="chatlist-item"><div class="avatar">🐻</div><div class="meta"><b>친구들</b><div class="last">好可爱的猫!</div></div><time>周一</time></div>
  `;
}
function renderChat(who){
  const msgs = messagesStore[who]||messagesStore.sakuya;
  return `
    <div id="chatlog">
      <div class="msg-date">今天</div>

/* ================================================================
   WIRE — app-specific listeners after DOM insertion
   ================================================================ */
function wireApp(name,opts={}){
  const who = opts.with || 'sakuya';
  switch(name){
    case 'messages':
      appcontent.querySelectorAll('[data-chat]').forEach(el=>el.addEventListener('click',()=>enterChat(el.dataset.chat)));
      break;
    case 'chat':
      backBtn.textContent='‹ '+titles.messages;
      setTimeout(()=>{ const cl=$('chatlog'); if(cl) cl.scrollTop=cl.scrollHeight; },50);
      $('chatsend').onclick=()=>doSendChat(who);
      $('chatinput').addEventListener('keydown',e=>{ if(e.key==='Enter') doSendChat(who); });
      break;
    case 'kakao':
      appcontent.querySelectorAll('[data-kt]').forEach(el=>el.addEventListener('click',()=>enterKakaoChat(el.dataset.kt)));
      break;
    case 'kakaoChat':
      setTimeout(()=>{ const e=$('ktchatlog'); if(e) e.scrollTop=e.scrollHeight; },60);
      $('ktsend').onclick=()=>doSendKakao(who);
      $('ktinput').addEventListener('keydown',e=>{ if(e.key==='Enter') doSendKakao(who); });
      $('ktBack').onclick=()=>backBtn.click();
      break;
    case 'spotify':
      appcontent.querySelectorAll('[data-track]').forEach(el=>el.addEventListener('click',()=>{
        const i=+el.dataset.track, t=spotifyTracks[i];
        spNowPlaying={...spNowPlaying,title:t.title,artist:t.artist,emoji:t.emoji,durSec:parseTime(t.dur),playedSec:0,playing:true};
        $('spMiniTitle').textContent=t.title;
        openApp('spotifyPlayer');
      }));
      appcontent.querySelectorAll('[data-playlist]').forEach(el=>el.addEventListener('click',()=>toast('打开歌单 🎧')));
      break;
    case 'spotifyPlayer':
      const pb=$('spPlayBtn');
      if(pb){
        pb.onclick=()=>{ spNowPlaying.playing=!spNowPlaying.playing; pb.textContent=spNowPlaying.playing?'Ⅱ':'▶'; };
      }
      $('spClose')?.addEventListener('click',()=>backBtn.click());
      $('spProgress')?.addEventListener('click',e=>{
        const rect=e.currentTarget.getBoundingClientRect();
        const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
        spNowPlaying.playedSec=Math.floor(pct*spNowPlaying.durSec);
        updatePlayerProgress();
      });
      break;
    case 'notes':
      const nt=$('noteText');
      if(nt){
        nt.value=localStorage.getItem('sakuNotes')||'';
        nt.oninput=e=>localStorage.setItem('sakuNotes',e.target.value);
      }
      break;
    case 'photos':
      const pi=$('photoInput');
      if(pi){
        pi.onchange=e=>{
          const files=Array.from(e.target.files); if(!files.length)return;
          let saved=JSON.parse(localStorage.getItem('sakuPhotos')||'[]');
          let pending=files.length;
          files.forEach(f=>{
            const r=new FileReader();
            r.onload=ev=>{ saved.unshift(ev.target.result); if(--pending===0){
              localStorage.setItem('sakuPhotos',JSON.stringify(saved.slice(0,20)));
              appcontent.innerHTML=renderPhotos(); wireApp('photos');
            }};
            r.readAsDataURL(f);
          });
        };
      }
      break;
    case 'clock':
      tickClock();
      break;
    case 'phone':
      $('fakeCall')?.addEventListener('click',()=>toast('📞 사쿠의폰 · 这是粉丝模拟电话哦 ♡'));
      break;
  }
}
function parseTime(s){ const [m,sec]=s.split(':').map(Number); return m*60+sec; }
function updatePlayerProgress(){
  const cur=$('spCur'); const playBar=appcontent.querySelector('.sp-progress .played');
  if(cur) cur.textContent=fmt(spNowPlaying.playedSec);
  if(playBar) playBar.style.width=((spNowPlaying.playedSec/spNowPlaying.durSec)*100)+'%';
}
function startSpotifyTick(){
  stopSpotifyTick();
  spTick=setInterval(()=>{
    if(!spNowPlaying.playing) return;
    spNowPlaying.playedSec=Math.min(spNowPlaying.durSec, spNowPlaying.playedSec+1);
    const cur=$('spCur'); const playBar=document.querySelector('#appview .sp-progress .played');
    if(cur) cur.textContent=fmt(spNowPlaying.playedSec);
    if(playBar){ playBar.style.width=((spNowPlaying.playedSec/spNowPlaying.durSec)*100)+'%'; }
  },1000);
}
function stopSpotifyTick(){ if(spTick){clearInterval(spTick);spTick=null;} }

/* ---------- Clock tick ---------- */
function tickClock(){
  clearInterval(clockInterval);
  const update=()=>{
    const el=$('tokyo'); if(!el){ clearInterval(clockInterval); return; }
    const d=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Tokyo'});
    el.textContent=d;
  };
  update(); clockInterval=setInterval(update,1000);
}

/* ---------- Mini Spotify bar ---------- */
$('spPlay').addEventListener('click',()=>{
  spNowPlaying.playing=!spNowPlaying.playing;
  $('spPlay').textContent=spNowPlaying.playing?'Ⅱ':'▶';
  if(spNowPlaying.playing) startSpotifyTick(); else stopSpotifyTick();
});
$('spMiniOpen').addEventListener('click',()=>openApp('spotifyPlayer'));

/* ================================================================
   KEYBOARD ESC to close app
   ================================================================ */
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(pass.classList.contains('show')){ showLock(); }
    else if(appview.classList.contains('show')){ closeApp(); }
  }
});

/* start ticking now-playing */
startSpotifyTick();
</script>
</body>
</html>
