s:center;font-size:20px}.home{display:none;position:absolute;inset:0;background:linear-gradient(#f8e9efdd,#f0dce9ee),url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=900') center/cover}.home .status{color:#26202a}.homehead{padding:28px 24px 18px;display:flex;justify-content:space-between;align-items:end}.homehead h2{font-size:24px;margin:0;font-weight:650}.homehead small{color:#74616e}.widget{margin:0 18px 25px;padding:16px 18px;background:#ffffffa8;backdrop-filter:blur(22px);border:1px solid #ffffff9c;border-radius:23px;display:flex;justify-content:space-between;align-items:center}.widget strong{font-size:30px;font-weight:500}.widget .saku{font-size:35px}.grid{padding:0 17px;display:grid;grid-template-columns:repeat(4,1fr);gap:21px 8px}.app{border:0;background:none;color:#302932;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;text-shadow:0 1px 5px white}.appicon{width:59px;height:59px;border-radius:17px;background:linear-gradient(145deg,#fff,#f4e7ee);box-shadow:0 5px 12px #73566b25;display:grid;place-items:center;font-size:27px;border:1px solid #fff9}.dock{position:absolute;bottom:17px;left:13px;right:13px;height:83px;border-radius:27px;background:#ffffff80;backdrop-filter:blur(22px);display:flex;justify-content:space-evenly;align-items:center}.dock .appicon{width:53px;height:53px}.appview{display:none;position:absolute;inset:0;background:#fffafc;z-index:8;overflow:auto;padding-bottom:30px}.appbar{height:60px;padding:16px 17px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee5eb;position:sticky;top:0;background:#fffafcf2;backdrop-filter:blur(15px);z-index:2}.appbar button{border:0;background:#f4e8ee;border-radius:18px;padding:8px 13px;color:#9a5e7b;font-size:14px}.appbar b{font-size:16px}.content{padding:18px}.content h2{font-size:27px;margin:5px 0 18px}.card{background:#f7edf2;border-radius:20px;padding:16px;margin:12px 0}.muted{color:#927f8b;font-size:12px}.chatrow{display:flex;gap:10px;align-items:center;padding:14px 3px;border-bottom:1px solid #f0e8ed}.avatar{width:43px;height:43px;border-radius:50%;background:#efd6e2;display:grid;place-items:center;font-size:20px}.msg{max-width:82%;padding:11px 14px;background:#f3e6ed;border-radius:18px;margin:9px 0;font-size:14px}.msg.me{background:#f4d8e5;margin-left:auto}.compose{display:flex;gap:8px;margin-top:15px}.compose input{flex:1;min-width:0;border:1px solid #eadde4;border-radius:22px;padding:12px;font:inherit}.compose button,.pill{border:0;border-radius:20px;background:#e9c9d8;padding:10px 15px;color:#624255}.notes{width:100%;min-height:65vh;border:0;outline:0;resize:none;background:#fff8e8;border-radius:18px;padding:18px;font:16px/1.7 -apple-system,sans-serif}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.homebar{position:absolute;z-index:15;bottom:8px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:5px;background:#ffffffdd}.appview .homebar{background:#222}.passcode{display:none;position:absolute;inset:0;z-index:12;background:#f6e9efed;backdrop-filter:blur(30px);text-align:center;padding-top:95px}.passcode h3{font-weight:500;font-size:20px}.dots{display:flex;justify-content:center;gap:17px;margin:24px}.dot{width:11px;height:11px;border:1px solid #554451;border-radius:50%}.dot.filled{background:#554451}.pad{display:grid;grid-template-columns:repeat(3,68px);justify-content:center;gap:13px}.pad button{height:62px;border:0;border-radius:50%;background:#ffffffb5;font-size:24px;color:#41323e}.toast{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:#222b;color:white;padding:8px 15px;border-radius:18px;font-size:12px;z-index:30;display:none}

<script>
const $=id=>document.getElementById(id);let pin='',startY=0,appName='';
function updateTime(){const d=new Date();const t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('lockclock').textContent=$('pclock').textContent=$('homeclock').textContent=t;$('bigtime').textContent=t;$('lockdate').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
updateTime();setInterval(updateTime,10000);
const lock=$('lock');function beginUnlock(){$('passcode').style.display='block';pin='';dots()}
lock.addEventListener('touchstart',e=>startY=e.touches[0].clientY);lock.addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>35)beginUnlock()});lock.addEventListener('mousedown',e=>startY=e.clientY);lock.addEventListener('mouseup',e=>{if(startY-e.clientY>35)beginUnlock()});$('swipe').onclick=beginUnlock;
function verifyPin(){if(pin==='1118'){$('passcode').style.display='none';lock.style.display='none';$('home').style.display='block';$('homebar').style.background='#fff'}else{pin='';dots();toast('密码不正确，请重试')}}function pressKey(k){if(k==='⌫'){pin=pin.slice(0,-1);dots();return}if(!/^[0-9]$/.test(String(k))||pin.length>=4)return;pin+=String(k);dots();if(pin.length===4)setTimeout(verifyPin,120)}
document.querySelectorAll('#pad button[data-key]').forEach(b=>{b.onclick=()=>pressKey(b.dataset.key);b.addEventListener('touchend',e=>{e.preventDefault();pressKey(b.dataset.key)},{passive:false})});
function dots(){$('dots').innerHTML=[0,1,2,3].map(i=>'<i class="dot '+(i<pin.length?'filled':'')+'"></i>').join('')}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}
const titles={messages:'信息',line:'LINE',weverse:'Weverse',instagram:'Instagram',x:'X',youtube:'YouTube',spotify:'Spotify',photos:'照片',notes:'备忘录',calendar:'日历',clock:'时钟',settings:'设置',phone:'电话',safari:'Safari',music:'音乐'};
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
function openApp(name){appName=name;$('apptitle').textContent=titles[name]||name;$('appcontent').innerHTML=render(name);$('appview').style.display='block';$('homebar').style.display='none';if(name==='notes'){$('noteText').value=localStorage.sakuNotes||'';$('noteText').oninput=e=>localStorage.sakuNotes=e.target.value}if(name==='clock')tickClock()}
$('back').onclick=closeApp;function closeApp(){$('appview').style.display='none';$('homebar').style.display='block'}
function render(n){
if(n==='messages'||n==='line')return '<h2>信息</h2><div class="chatrow"><div class="avatar">🐰</div><div><b>사쿠</b><div class="muted">今天也要一起度过美好的一天 ♡</div></div></div><div id="chatlog"><div class="msg">사쿠：今天有好好吃饭吗？</div><div class="msg me">有！一直在为你加油 ♡</div><div class="msg">사쿠：那就好，明天也要见面哦。</div></div><div class="compose"><input id="chatinput" placeholder="iMessage"><button onclick="sendChat()">发送</button></div>';
if(n==='kakao')return '<div class="kt-head"><h2>카카오톡</h2><span>⌕　＋　⚙</span></div><div class="kt-tabs"><b>全部</b><span>未读</span><span>频道</span></div><div class="kt-row"><div class="kt-avatar">🐰</div><div style="flex:1"><b>사쿠</b><div class="muted">오늘도 고마워요 ♡</div></div><small>下午 3:18</small></div><div class="kt-row"><div class="kt-avatar">🌸</div><div style="flex:1"><b>사쿠 팬방</b><div class="muted">今天也要为咲哉应援！</div></div><small>昨天</small></div><div class="kt-row"><div class="kt-avatar">🐻</div><div style="flex:1"><b>친구들</b><div class="muted">照片</div></div><small>周一</small></div><div class="kt-bottom"><span><b>♙</b>朋友</span><span><b>▤</b>聊天</span><span><b>◉</b>动态</span><span><b>•••</b>更多</span></div>';
if(n==='kakaoChat')return '<div class="kt-chathead"><span onclick="openApp(\'kakao\')">‹</span><div class="kt-avatar">🐰</div><b>사쿠</b><span style="margin-left:auto">⌕　☰</span></div><div class="kt-chatbg" id="chatlog"><div class="muted">今天</div><div class="kt-bubble">오늘도 와줘서 고마워요 ♡</div><div class="kt-bubble me">今天也一直在支持你！</div><div class="kt-bubble">밥 잘 챙겨 먹어요! 🐰</div></div><div class="compose"><input id="chatinput" placeholder="输入消息"><button onclick="sendChat()">发送</button></div>';
if(n==='spotify'||n==='music')return '<div class="spotify"><div class="sp-top"><b style="font-size:25px">Spotify</b><span>⚙　◉</span></div><div style="display:flex;gap:8px;margin:18px 0"><span class="sp-chip">全部</span><span class="sp-chip">音乐</span><span class="sp-chip">播客</span></div><h2>为你推荐</h2><div class="sp-card"><div class="sp-cover">🐰</div><div>사쿠's playlist<br><small style="color:#aaa">Sakuya · 喜爱的歌曲</small></div></div><div class="sp-card"><div class="sp-cover" style="background:linear-gradient(135deg,#9d6c87,#251a29)">🎧</div><div>Daily Mix 1<br><small style="color:#aaa">为你精选</small></div></div><div class="sp-card"><div class="sp-cover" style="background:linear-gradient(135deg,#b8a2d6,#40344d)">🌙</div><div>Chill Hits<br><small style="color:#aaa">放松时刻</small></div></div><h2 style="margin-top:28px">最近播放</h2><div class="sp-card" onclick="openApp(\'spotifyPlayer\')"><div class="sp-cover">💿</div><div>你的音乐时光<br><small style="color:#aaa">点击打开播放器</small></div></div><div class="kt-bottom" style="background:#121212;color:#aaa"><span><b>⌂</b>主页</span><span><b>⌕</b>搜索</span><span><b>▤</b>你的音乐库</span></div></div>';
if(n==='spotifyPlayer')return '<div class="spotify"><div class="sp-top"><span onclick="openApp(\'spotify\')">⌄</span><b>正在播放</b><span>•••</span></div><div class="sp-album">🐰</div><div style="display:flex;justify-content:space-between;align-items:center"><div><h2 style="margin:0">Saku's playlist</h2><span style="color:#aaa">Sakuya · Fan playlist</span></div><span>＋</span></div><div class="sp-progress"><i></i></div><div style="display:flex;justify-content:space-between;color:#aaa;font-size:11px"><span>1:24</span><span>3:42</span></div><div class="sp-controls"><span>🔀</span><span>⏮</span><button class="sp-play" onclick="this.textContent=this.textContent==='Ⅱ'?'▶':'Ⅱ'">▶</button><span>⏭</span><span>🔁</span></div><div style="color:#aaa">歌词　　队列　　连接设备</div></div>';
if(n==='notes')return '<h2>备忘录</h2><textarea class="notes" id="noteText" placeholder="记录想对咲哉说的话…"></textarea><p class="muted">自动保存在此设备</p>';
if(n==='photos')return '<h2>照片</h2><div class="card">选择你想放进相册的照片 ♡<p><input type="file" accept="image/*" multiple onchange="addPhotos(event)"></p><div class="photoGrid" id="photoGrid"></div></div>';
if(n==='calendar')return '<h2>日历</h2><div class="card"><h1>22</h1>星期四 · 10月<br><p>♡ 想念咲哉的每一天</p></div>';
if(n==='clock')return '<h2>时钟</h2><div class="card"><h1 id="tokyo">--:--:--</h1>东京 · 日本标准时间</div><div class="card">闹钟　　＋</div>';
if(n==='phone')return '<h2>个人收藏</h2><div class="card" style="text-align:center"><div style="font-size:55px">🐰</div><b>사쿠</b><p class="muted">模拟电话界面</p><button class="pill" onclick="toast(\'这是粉丝模拟电话哦 ♡\')">拨打</button></div>';
if(n==='settings')return '<h2>设置</h2>'+['飞行模式','Wi‑Fi','蓝牙','通知','墙纸','密码：1118','关于本机 · 사쿠의폰'].map(x=>'<div class="card">'+x+'　›</div>').join('');
if(n==='safari')return '<h2>收藏</h2>'+[['Weverse','https://weverse.io/'],['YouTube','https://youtube.com/'],['Instagram','https://instagram.com/'],['Spotify','https://open.spotify.com/']].map(x=>'<a class="card" style="display:block;color:#8a5470;text-decoration:none" href="'+x[1]+'" target="_blank">'+x[0]+'　↗</a>').join('');
const links={weverse:'https://weverse.io/',instagram:'https://instagram.com/',x:'https://x.com/',youtube:'https://youtube.com/'};return '<h2>'+titles[n]+'</h2><div class="card">사쿠의 업데이트를 기다리는 중… ♡<p class="muted">粉丝制作的模拟界面，不连接真实账号。</p><a href="'+(links[n]||'#')+'" target="_blank">打开官方应用网站 ↗</a></div>'}
</script>

<style>

#lock:after{background:linear-gradient(180deg,#00000012 0%,transparent 36%,#00000020 65%,#00000040 100%)}
.lock .status{height:48px;padding:15px 29px 0;font-size:15px;font-weight:650;color:white}
.lockdate{margin-top:91px;font-size:21px;font-weight:550;letter-spacing:.1px;text-shadow:0 2px 18px #0008}
.locktime{font-size:clamp(94px,26vw,112px);font-weight:250;letter-spacing:-7px;line-height:1.02;font-variant-numeric:tabular-nums;text-shadow:0 3px 24px #0006}
.lockmsg{display:inline-block;margin-top:15px;padding:9px 17px;border:1px solid #ffffff55;border-radius:24px;background:#ffffff25;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:13px}
.swipe{bottom:91px;font-size:13px;font-weight:550;padding:16px 0;touch-action:none}
.chev{font-size:27px}
.flash,.camera{bottom:29px;width:52px;height:52px;border:1px solid #ffffff55;background:#ffffff35;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);font-size:21px}
.passcode{padding-top:110px;background:linear-gradient(#17151a55,#17151a77),url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=1400&q=90') center/cover;color:#fff}
.passcode:before{content:"";position:absolute;inset:0;background:#16121a66;backdrop-filter:blur(38px);z-index:0;pointer-events:none}
.passcode>*{position:relative;z-index:1}
.passcode .status{color:#fff}
.passcode h3{font-size:20px;font-weight:550;margin:38px 0 0}
.passcode .dots{gap:19px;margin:28px 0 36px}
.passcode .dot{width:10px;height:10px;border:1.2px solid #fff;background:transparent}
.passcode .dot.filled{background:#fff}
.pad{grid-template-columns:repeat(3,minmax(0,74px));gap:14px 19px}
.pad button{height:70px;width:70px;justify-self:center;border:1px solid #ffffff55;background:#ffffff28;color:#fff;font-size:30px;font-weight:350;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);touch-action:manipulation;-webkit-tap-highlight-color:transparent;pointer-events:auto;position:relative;z-index:3}
.pad button:active{background:#ffffff65;transform:scale(.96)}
.pad-empty{width:70px;height:70px}
.pad .delete-key{border:0;background:transparent;font-size:13px;font-weight:500}
.passcode .muted{color:#ffffffd0;margin-top:25px}
@media(max-height:720px){.passcode{padding-top:70px}.passcode h3{margin-top:20px}.passcode .dots{margin:18px 0 22px}.pad{gap:9px 16px}.pad button,.pad-empty{height:61px;width:61px}}
</style>
<script>
/* Robust unlock fallback. A tap on the swipe prompt or an upward gesture opens passcode. */
(function(){
 const lock=document.getElementById('lock'), pass=document.getElementById('passcode'), prompt=document.getElementById('swipe');
 if(!lock||!pass)return;
 let y=null;
 function open(){if(pass.style.display!=='block'){pass.style.display='block';if(typeof beginUnlock==='function')beginUnlock();}}
 lock.addEventListener('pointerdown',e=>{y=e.clientY;},{capture:true,passive:true});
 lock.addEventListener('pointerup',e=>{if(y!==null&&y-e.clientY>12)open();y=null;},{capture:true,passive:true});
 lock.addEventListener('touchstart',e=>{y=e.touches[0].clientY;},{capture:true,passive:true});
 lock.addEventListener('touchend',e=>{if(y!==null&&y-e.changedTouches[0].clientY>12)open();y=null;},{capture:true,passive:true});
 prompt.addEventListener('click',open);
 prompt.addEventListener('pointerup',open);
 prompt.addEventListener('touchend',open,{passive:true});
 lock.addEventListener('click',e=>{if(e.target===lock||e.target.closest('#swipe'))open();});
})();
</script></body></html>
